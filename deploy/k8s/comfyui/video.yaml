apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-video-data
spec:
  capacity:
    storage: 1Ti
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: comfyui-video-local
  local:
    path: /mapdata1/comfyui-video
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - xszn-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-video-data
  namespace: comfyui
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: comfyui-video-local
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-video
  namespace: comfyui
  labels:
    app: comfyui-video
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui-video
  template:
    metadata:
      labels:
        app: comfyui-video
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: xszn-server
      terminationGracePeriodSeconds: 30
      containers:
      - name: comfyui
        image: ghcr.nju.edu.cn/ai-dock/comfyui:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: WORKSPACE
          value: /workspace
        - name: AUTO_UPDATE
          value: |-
            false
        - name: WEB_ENABLE_AUTH
          value: |-
            true
        - name: WEB_ENABLE_HTTPS
          value: |-
            false
        - name: WEB_USER
          value: admin
        - name: WEB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: comfyui-auth
              key: password
        - name: WEB_TOKEN
          valueFrom:
            secretKeyRef:
              name: comfyui-auth
              key: token
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        - name: COMFYUI_PORT
          value: |-
            8188
        - name: COMFYUI_PORT_HOST
          value: |-
            8188
        - name: COMFYUI_INSTANCE
          value: video
        - name: COMFYUI_REF
          value: v0.42.1
        - name: CF_QUICK_TUNNELS
          value: |-
            false
        - name: PROVISIONING_SCRIPT
          value: https://cdn.jsdelivr.net/gh/7twvfbk6zd-dev/dp4@cb620515795beb89282ebe57e82a56e549954caf/deploy/k8s/comfyui/provision-comfyui.sh
        ports:
        - name: http
          containerPort: 8188
        resources:
          requests:
            cpu: 16
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 32
            memory: 64Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: data
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
        readinessProbe:
          httpGet:
            path: /ai-dock/health-check
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        startupProbe:
          httpGet:
            path: /ai-dock/health-check
            port: http
          periodSeconds: 10
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /ai-dock/health-check
            port: http
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: comfyui-video-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-video
  namespace: comfyui
spec:
  type: NodePort
  selector:
    app: comfyui-video
  ports:
  - name: http
    port: 8188
    targetPort: http
    nodePort: 30189
