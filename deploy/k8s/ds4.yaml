apiVersion: v1
kind: Namespace
metadata:
  name: ds4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds4
  namespace: ds4
  labels:
    app: ds4
spec:
  # One replica is intentional: the 4 TP ranks run inside this single pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ds4
  template:
    metadata:
      labels:
        app: ds4
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
      - name: ds4
        image: ds4:v3
        imagePullPolicy: IfNotPresent
        env:
        - name: DS4_CTX
          value: "131072"
        - name: DS4_EXPERT_CACHE
          value: "384"
        - name: DS4_PREFILL
          value: "2048"
        - name: DS4_TP_WORLD
          value: "4"
        # 2 sessions need ~25.5-27.9GiB before the expert cache on 24GB cards;
        # the TP path also deadlocks at the rank gate, so keep this at 0.
        - name: DS4_BATCHED_SESSION
          value: "0"
        resources:
          requests:
            cpu: "16"
            memory: "64Gi"
            nvidia.com/gpu: "4"
          limits:
            nvidia.com/gpu: "4"
        ports:
        - containerPort: 18080
          name: http
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: shm
          mountPath: /dev/shm
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 18080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 18080
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 6
      volumes:
      - name: models
        hostPath:
          path: /mapdata1/tools/ds4-main/gguf
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ds4
  namespace: ds4
spec:
  selector:
    app: ds4
  ports:
  - name: http
    port: 18080
    targetPort: 18080