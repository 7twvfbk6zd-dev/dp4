apiVersion: v1
kind: Namespace
metadata:
  name: swarmui
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: swarmui-data
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: swarmui-local
  local:
    path: /mapdata1/swarmui
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - xszn-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmui-data
  namespace: swarmui
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: swarmui-local
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmui
  namespace: swarmui
  labels:
    app: swarmui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: swarmui
  template:
    metadata:
      labels:
        app: swarmui
    spec:
      nodeSelector:
        kubernetes.io/hostname: xszn-server
      containers:
      - name: swarmui
        image: swarmui:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7801
          name: http
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: ASPNETCORE_URLS
          value: http://0.0.0.0:7801
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "8"
            memory: 12Gi
        readinessProbe:
          httpGet:
            path: /
            port: 7801
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /SwarmUI/Data
        - name: output
          mountPath: /SwarmUI/Output
        - name: models
          mountPath: /SwarmUI/Models
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: swarmui-data
      - name: output
        hostPath:
          path: /mapdata1/swarmui/Output
          type: DirectoryOrCreate
      - name: models
        hostPath:
          path: /mapdata1/comfyui/ComfyUI/models
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: swarmui
  namespace: swarmui
spec:
  type: NodePort
  selector:
    app: swarmui
  ports:
  - port: 7801
    targetPort: 7801
    nodePort: 30190
    name: http