apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-data
  namespace: aiops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: aiops
  labels:
    app: new-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      containers:
        - name: new-api
          image: docker.m.daocloud.io/calciumion/new-api:v1.0.0-rc.46
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: PORT
              value: "3000"
            - name: SQLITE_PATH
              value: /data/new-api.db
            - name: DEFAULT_LANGUAGE
              value: zh-CN
            - name: GENERATE_DEFAULT_TOKEN
              value: "false"
            - name: RELAY_TIMEOUT
              value: "0"
            - name: STREAMING_TIMEOUT
              value: "600"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-session
                  key: session-secret
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/setup
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/setup
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: aiops
spec:
  type: NodePort
  selector:
    app: new-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
