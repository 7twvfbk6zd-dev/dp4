# Do not commit real credentials. Create these secrets before applying:
#
#   kubectl -n aiops create secret generic new-api-session \\
#     --from-literal=session-secret="$(openssl rand -hex 32)"
#   kubectl -n aiops create secret generic grafana-admin \\
#     --from-literal=admin-password='replace-with-a-strong-password'
#
# This file is documentation only.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: aiops
type: Opaque
stringData:
  admin-password: replace-with-a-strong-password
---
apiVersion: v1
kind: Secret
metadata:
  name: new-api-session
  namespace: aiops
type: Opaque
stringData:
  session-secret: replace-with-a-random-session-secret
